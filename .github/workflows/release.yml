name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Checkout leaves the tag without its message.
      - name: Fetch the tag
        run: git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32
          path: firmware
          command: >-
            idf.py --preset release build &&
            cd build/release &&
            python -m esptool --chip esp32 merge-bin -o ../../nimbus-${{ github.ref_name }}.bin @flash_args

      - name: Check the version
        run: |
          version=$(jq -r .project_version firmware/build/release/project_description.json)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, firmware version $version"
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="nimbus-${GITHUB_REF_NAME}.bin"
          {
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo
            echo "## Flashing"
            echo
            echo "\`$image\` is the full image: bootloader, partition table, app and assets."
            echo
            echo '```'
            echo "esptool --chip esp32 -p COM3 write-flash 0x0 $image"
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "firmware/$image" --title "Nimbus $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
